# refresh.conf — meos-rs's last leg for tools/refresh-binding.sh (in MEOS-API).
# main is the MEOS 1.4 line of the crate, and stable-1.3 its 1.3 line, so main derives the catalog
# and libmeos from MobilityDB master with every family, as the other bindings' 1.4 lines do.
# sys/regenerate.sh runs the pinned bindgen over the installed MEOS headers with the catalog's
# names as its allowlist and rewrites the committed sys/prebuilt-bindings/meos.rs;
# sys/check_drift.py then holds every bound function to the catalog's name and arity.
ENGINE=rust
BUILD_DIR=.
BUILD_LIBMEOS=true
MDB_REF=master
FAMILIES=-DALL=ON
CATALOG_DEST=
BUILD_CMD='bash sys/regenerate.sh "$CATALOG" "$PREFIX"
  python3 sys/check_drift.py "$CATALOG" sys/prebuilt-bindings/meos.rs
  export MEOS_LIB_DIR="$PREFIX/lib" LD_LIBRARY_PATH="$PREFIX/lib" PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
  cargo build --no-default-features --features geos
  cargo clippy --no-default-features --features geos -- -D warnings
  [ -n "${SKIP_TESTS:-}" ] || cargo test --no-default-features --features geos'
