[package]
name = "meos-src"
version = "0.2.0"
edition = "2021"
links = "meossrc"
build = "build.rs"
description = "static library build for meos-sys"
repository = "https://github.com/MobilityDB/meos-rs"
authors = ["David García Morillo <david.garcia.morillo@ulb.be>"]
license-file = "../LICENSE"
exclude = [
  "source/mobilitydb",
  "source/meos/examples",
  "source/doc/images",
  "h3/tests",
  "h3/website",
  "h3/dev-docs",
  "json-c/tests",
]

[dependencies]
proj-sys = "0.27"

[features]
bundled = ["proj-sys/bundled_proj"]

[build-dependencies]
cmake = "0.1"

