name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "stable-1.3" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-system:
    name: Test (system MEOS)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # libmeos and its catalog from MobilityDB master with every family, as MobilityDB's own
    # CI builds MEOS, through the shared provision-meos action pinned to a MEOS-API commit.
    # The action installs libmeos and a GDAL built without GEOS under /usr/local.
    - name: Provision MEOS (master, every family)
      id: provision
      uses: MobilityDB/MEOS-API/.github/actions/provision-meos@1c9a7aa200c7f673f7a130efdc1db268396ee029
      with:
        mobilitydb-ref: master
        build-libmeos: "true"

    # The geos crate is the object layer's geometry type, so its library stays.
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-missing libgeos-dev

    - name: Add library to LDPATH
      run: echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib" >> $GITHUB_ENV

    - name: Build
      run: cargo build --verbose --no-default-features --features geos

    - name: Clippy
      run: cargo clippy --no-default-features --features geos -- -D warnings

    - name: Run tests
      run: cargo test --verbose --no-default-features --features geos

    - name: Download example data
      run: |
        mkdir -p data
        curl -o data/ais_instants.csv https://raw.githubusercontent.com/MobilityDB/MobilityDB/master/meos/examples/data/ais_instants.csv

    - name: Run examples
      run: |
        cargo run --example 01_hello_world --no-default-features --features geos
        cargo run --example 02_ais_read --no-default-features --features geos
        cargo run --example 03_ais_assemble --no-default-features --features geos

  ffi-drift:
    name: FFI matches bindgen over the headers and the catalog
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Provision MEOS (master, every family)
      id: provision
      uses: MobilityDB/MEOS-API/.github/actions/provision-meos@1c9a7aa200c7f673f7a130efdc1db268396ee029
      with:
        mobilitydb-ref: master
        build-libmeos: "true"

    - name: Install bindgen's libclang
      run: sudo apt-get install -y libclang-dev

    # The pinned bindgen over the installed headers, keeping the catalog's names, must write
    # the committed FFI: a MEOS change the FFI has not taken surfaces here.
    - name: Regenerate the FFI with bindgen
      run: bash sys/regenerate.sh "${{ steps.provision.outputs.catalog-path }}" "${{ steps.provision.outputs.libmeos-prefix }}"

    - name: Assert the committed FFI is bindgen's output
      run: git diff --exit-code sys/prebuilt-bindings/meos.rs sys/wrapper.h sys/allowlist.txt

    # Every bound function is a catalog function of the same arity.
    - name: Check the FFI against the catalog
      run: python3 sys/check_drift.py "${{ steps.provision.outputs.catalog-path }}" sys/prebuilt-bindings/meos.rs

  test-bundled:
    name: Test (bundled MEOS)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build tools
      run: sudo apt-get install -y cmake clang libclang-dev pkg-config sqlite3 libsqlite3-dev

    - name: Build
      run: cargo build --verbose --features bundled

    - name: Clippy
      run: cargo clippy --features bundled -- -D warnings

    - name: Run tests
      run: cargo test --verbose --features bundled

    - name: Download example data
      run: |
        mkdir -p data
        curl -o data/ais_instants.csv https://raw.githubusercontent.com/MobilityDB/MobilityDB/master/meos/examples/data/ais_instants.csv

    - name: Run examples
      run: |
        cargo run --example 01_hello_world --features bundled
        cargo run --example 02_ais_read --features bundled
        cargo run --example 03_ais_assemble --features bundled
