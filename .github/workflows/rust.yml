name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "stable-1.3" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-system:
    name: Test (system MEOS)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # libmeos and its catalog from MobilityDB master with every family, as MobilityDB's own
    # CI builds MEOS, through the shared provision-meos action pinned to a MEOS-API commit.
    # The action installs libmeos and a GDAL built without GEOS under /usr/local.
    - name: Provision MEOS (master, every family)
      id: provision
      uses: MobilityDB/MEOS-API/.github/actions/provision-meos@43b601a8b331bfb63956466cc334aa0fd0f017c8
      with:
        mobilitydb-ref: master
        build-libmeos: "true"

    # The geos crate is the object layer's geometry type, so its library stays.
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-missing libgeos-dev

    - name: Add library to LDPATH
      run: echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib" >> $GITHUB_ENV

    - name: Build
      run: cargo build --verbose --no-default-features --features geos

    - name: Clippy
      run: cargo clippy --no-default-features --features geos -- -D warnings

    - name: Run tests
      run: cargo test --verbose --no-default-features --features geos

    - name: Download example data
      run: |
        mkdir -p data
        curl -o data/ais_instants.csv https://raw.githubusercontent.com/MobilityDB/MobilityDB/master/meos/examples/data/ais_instants.csv

    - name: Run examples
      run: |
        cargo run --example 01_hello_world --no-default-features --features geos
        cargo run --example 02_ais_read --no-default-features --features geos
        cargo run --example 03_ais_assemble --no-default-features --features geos

  codegen-drift:
    name: FFI generated from the catalog (no drift)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Provision MEOS (master, every family)
      id: provision
      uses: MobilityDB/MEOS-API/.github/actions/provision-meos@43b601a8b331bfb63956466cc334aa0fd0f017c8
      with:
        mobilitydb-ref: master
        build-libmeos: "true"

    # The generator's own rules (widths, variadics, layouts, callbacks, the types it
    # refuses), each over a small catalog.
    - name: Test the generator
      run: python3 sys/tests/test_codegen.py

    # meos-sys is a projection of the catalog: the committed FFI must be what codegen.py
    # writes from it, so a MEOS change the FFI has not taken surfaces here.
    - name: Regenerate the FFI from the catalog
      run: python3 sys/codegen.py "${{ steps.provision.outputs.catalog-path }}" sys/src/generated.rs

    - name: Assert the committed FFI matches the catalog
      run: git diff --exit-code sys/src/generated.rs

  test-bundled:
    name: Test (bundled MEOS)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # The libraries a MEOS build with every family finds on the system beside the ones
    # meos-src builds: libxml2 and zlib, and PROJ and SQLite for the GDAL below.
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake pkg-config sqlite3 libsqlite3-dev libproj-dev libxml2-dev zlib1g-dev

    # The RASTER family links GDAL, built without GEOS by the script MEOS-API's
    # provision-meos action builds it with, at the commit the system job pins.
    - name: Fetch MEOS-API
      uses: actions/checkout@v4
      with:
        repository: MobilityDB/MEOS-API
        ref: 43b601a8b331bfb63956466cc334aa0fd0f017c8
        path: _meos_api

    - name: Build GDAL without GEOS
      run: |
        bash _meos_api/.github/actions/provision-meos/build-gdal.sh "$RUNNER_TEMP/gdal-prefix"
        sudo cp -a "$RUNNER_TEMP/gdal-prefix/." /usr/local/
        sudo ldconfig

    - name: Build
      run: cargo build --verbose --features bundled

    - name: Clippy
      run: cargo clippy --features bundled -- -D warnings

    - name: Run tests
      run: cargo test --verbose --features bundled

    - name: Download example data
      run: |
        mkdir -p data
        curl -o data/ais_instants.csv https://raw.githubusercontent.com/MobilityDB/MobilityDB/master/meos/examples/data/ais_instants.csv

    - name: Run examples
      run: |
        cargo run --example 01_hello_world --features bundled
        cargo run --example 02_ais_read --features bundled
        cargo run --example 03_ais_assemble --features bundled
